plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.qqbinding'
    compileSdk 37

    defaultConfig {
        applicationId 'com.local.qqbinding'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
