<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QQ绑定查询</title>
<style>
:root{color-scheme:light;--primary:#2563eb;--primary-dark:#1d4ed8;--ink:#172033;--muted:#6b7890;--line:#e5eaf2;--surface:#fff;--bg:#f4f7fb;--success:#07845b;--success-bg:#e8f8f1;--danger:#b42318;--danger-bg:#fff0ee;--shadow:0 14px 38px rgba(35,57,91,.09)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#e9f1ff 0,#f4f7fb 38%,#f8fafc 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{width:min(620px,100%);margin:0 auto;padding:28px 18px 34px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:23px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 9px 20px rgba(37,99,235,.25)}h1{font-size:25px;letter-spacing:.2px;margin:0 0 3px}.subtitle{margin:0;color:var(--muted);font-size:13px}.card{background:rgba(255,255,255,.94);border:1px solid rgba(229,234,242,.95);border-radius:18px;box-shadow:var(--shadow)}.search-card{padding:18px}.label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:0 0 9px}.search-row{display:flex;gap:10px}input{flex:1;min-width:0;height:50px;border:1px solid #d4dce8;border-radius:12px;padding:0 14px;color:var(--ink);font-size:16px;outline:0;background:#fff;transition:border-color .18s,box-shadow .18s}input:focus{border-color:#7aa7ff;box-shadow:0 0 0 4px rgba(37,99,235,.11)}button{border:0;border-radius:12px;min-height:50px;padding:0 20px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 8px 16px rgba(37,99,235,.2);cursor:pointer;transition:transform .15s,filter .15s}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait;filter:grayscale(.2)}.hint{font-size:12px;color:#94a0b2;margin:10px 2px 0}.status{min-height:22px;margin:18px 2px 8px;font-size:13px;color:var(--muted)}.status.success{color:var(--success)}.status.error{color:var(--danger)}.result-card{padding:18px}.empty{min-height:148px;display:grid;place-items:center;text-align:center;color:#8b98aa}.empty-icon{font-size:32px;opacity:.7;margin-bottom:5px}.empty p{margin:0;font-size:13px}.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.result-title{font-weight:760;font-size:17px;margin:0 0 3px}.result-query{font-size:12px;color:var(--muted);margin:0}.badge{flex:none;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--success);background:var(--success-bg)}.summary{display:flex;gap:10px;margin-bottom:14px}.summary-item{flex:1;background:#f6f8fc;border:1px solid #edf0f5;border-radius:12px;padding:11px 12px}.summary-value{font-size:20px;line-height:1.1;font-weight:780}.summary-label{margin-top:4px;color:var(--muted);font-size:11px}.section{border-top:1px solid #edf0f5;padding:15px 0 1px}.section:first-of-type{border-top:0;padding-top:2px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.section-name{font-size:14px;font-weight:730}.section-count{font-size:11px;color:var(--muted);background:#f2f5f9;border-radius:999px;padding:4px 8px}.values{display:flex;flex-wrap:wrap;gap:8px}.value{display:inline-flex;align-items:center;max-width:100%;padding:8px 10px;border:1px solid #dce6f5;border-radius:9px;background:#f8fbff;color:#28476f;font-size:13px;line-height:1.25;word-break:break-all}.no-data{padding:18px 12px;border-radius:12px;text-align:center;background:#f8fafc;color:var(--muted);font-size:13px}.copy-row{display:flex;justify-content:flex-end;margin-top:14px}.copy{min-height:40px;padding:0 14px;font-size:13px;background:#eef3fb;color:#31527f;box-shadow:none}.footer-note{margin:16px 3px 0;color:#97a2b2;font-size:11px;line-height:1.6;text-align:center}@media(max-width:420px){main{padding:22px 13px 28px}.search-row{gap:8px}button{padding:0 15px}.summary-item{padding:10px}.summary-value{font-size:18px}}
</style>
</head>
<body><main>
<header class="brand"><div class="brand-icon">Q</div><div><h1>QQ绑定查询</h1><p class="subtitle">简洁、清晰地查看查询结果</p></div></header>
<section class="card search-card"><label class="label" for="qq">QQ 号码</label><div class="search-row"><input id="qq" inputmode="numeric" maxlength="12" placeholder="请输入 5-12 位数字" autocomplete="off"><button id="query" type="button">查询</button></div><div class="hint">仅查询你本人或已获明确授权的数据</div></section>
<div id="status" class="status" aria-live="polite"></div>
<section class="card result-card" aria-live="polite"><div id="result" class="empty"><div><div class="empty-icon">⌕</div><p>输入 QQ 号后，结果会显示在这里</p></div></div><div class="copy-row"><button id="copy" class="copy" type="button">复制整理后的结果</button></div></section>
<p class="footer-note">请求通过 HTTPS 发送到查询服务；页面不会保存查询记录。</p>
</main>
<script>
const input=document.getElementById('qq'),query=document.getElementById('query'),status=document.getElementById('status'),result=document.getElementById('result'),copy=document.getElementById('copy');
const fields={names:'名称',nicknames:'昵称',phone_numbers:'手机号',id_numbers:'身份证号',qq_numbers:'QQ号',wb_numbers:'微博号',passwords:'密码',emails:'邮箱',addresses:'地址'};let plain='';
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(v){if(Array.isArray(v))return v;if(v===null||v===undefined||v==='')return[];return [v]}
function resetResult(){result.className='empty';result.innerHTML='<div><div class="empty-icon">⌕</div><p>输入 QQ 号后，结果会显示在这里</p></div>';plain=''}
function render(o,qq){const data=o&&o.data&&typeof o.data==='object'?o.data:{};const entries=Object.keys(data).map(function(k){return [k,arr(data[k])]}).filter(function(x){return x[1].length});let total=entries.reduce(function(n,x){return n+x[1].length},0);let sections=entries.map(function(x){const k=x[0],values=x[1],name=fields[k]||k;return '<section class="section"><div class="section-head"><span class="section-name">'+esc(name)+'</span><span class="section-count">'+values.length+' 项</span></div><div class="values">'+values.map(function(v){return '<span class="value">'+esc(typeof v==='object'?JSON.stringify(v):v)+'</span>'}).join('')+'</div></section>'}).join('');let head='<div class="result-top"><div><p class="result-title">查询结果</p><p class="result-query">QQ：'+esc(qq)+'</p></div><span class="badge">查询成功</span></div>';let summary='<div class="summary"><div class="summary-item"><div class="summary-value">'+total+'</div><div class="summary-label">发现字段</div></div><div class="summary-item"><div class="summary-value">'+entries.length+'</div><div class="summary-label">数据分类</div></div></div>';let body=sections||'<div class="no-data">暂未发现关联数据</div>';result.className='';result.innerHTML=head+summary+body;plain='QQ：'+qq+'\n查询结果\n';if(!entries.length)plain+='暂未发现关联数据';else entries.forEach(function(x){plain+='\n'+(fields[x[0]]||x[0])+':\n'+x[1].map(String).join('\n')});}
async function run(){const value=input.value.trim();if(!/^\d{5,12}$/.test(value)){status.className='status error';status.textContent='请输入 5-12 位数字 QQ 号';return}query.disabled=true;query.textContent='查询中…';status.className='status';status.textContent='正在查询，请稍候…';resetResult();try{const response=await fetch('/api/query?value='+encodeURIComponent(value),{headers:{Accept:'application/json'}}),text=await response.text();if(!response.ok)throw Error('HTTP '+response.status);let obj;try{obj=JSON.parse(text)}catch(_){throw Error('返回数据格式异常')}if(obj.code!==0)throw Error(obj.message||'服务返回错误');render(obj,value);status.className='status success';status.textContent='查询完成'}catch(e){status.className='status error';status.textContent='请求失败：'+e.message;result.className='no-data';result.textContent='暂时无法取得查询结果，请稍后重试';plain=''}finally{query.disabled=false;query.textContent='查询'}}
query.onclick=run;input.addEventListener('keydown',function(e){if(e.key==='Enter')run()});copy.onclick=async function(){if(!plain){status.className='status error';status.textContent='暂无可复制的结果';return}try{if(window.AndroidClipboard&&typeof window.AndroidClipboard.copy==='function'){window.AndroidClipboard.copy(plain);status.className='status success';status.textContent='已复制整理后的结果';return}}catch(_){}try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(plain);status.className='status success';status.textContent='已复制整理后的结果';return}}catch(_){}try{const area=document.createElement('textarea');area.value=plain;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok){status.className='status success';status.textContent='已复制整理后的结果';return}}catch(_){}const range=document.createRange();range.selectNodeContents(result);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);status.className='status';status.textContent='已选中结果，请使用系统复制'};
</script>
</body></html>
